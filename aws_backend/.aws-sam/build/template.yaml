AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Bio-Clock Serverless Backend  S3, Cognito, DynamoDB, and the Intelligence
  Lambda (Rekognition + Claude 4.5)

  '
Globals:
  Function:
    Timeout: 45
    MemorySize: 512
    Runtime: python3.10
    Architectures:
    - x86_64
Resources:
  BioClockApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: '''OPTIONS,POST,GET,PUT,DELETE'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,Access-Control-Allow-Private-Network'''
        AllowOrigin: '''*'''
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::GetAtt:
              - BioClockUserPool
              - Arn
            Identity:
              Header: Authorization
  BioClockScansBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: bioclock-scans-v3-${AWS::AccountId}-${AWS::Region}
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - PUT
          - POST
          - GET
          - HEAD
          AllowedOrigins:
          - '*'
          MaxAge: 3000
  BioClockScansBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: BioClockScansBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowAuthenticatedRoleS3Access
          Effect: Allow
          Principal:
            AWS:
              Fn::GetAtt:
              - CognitoAuthenticatedRole
              - Arn
          Action:
          - s3:PutObject
          - s3:GetObject
          Resource:
            Fn::Sub: arn:aws:s3:::bioclock-scans-v3-${AWS::AccountId}-${AWS::Region}/public/*
  BioClockUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: bio-clock-users-v3
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireSymbols: false
          RequireNumbers: true
          RequireLowercase: true
  BioClockUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: bio-clock-flutter-client-v3
      UserPoolId:
        Ref: BioClockUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      - ALLOW_USER_SRP_AUTH
      - ALLOW_ADMIN_USER_PASSWORD_AUTH
  BioClockIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: bio_clock_identity_pool_v3
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
      - ClientId:
          Ref: BioClockUserPoolClient
        ProviderName:
          Fn::GetAtt:
          - BioClockUserPool
          - ProviderName
  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated: cognito-identity.amazonaws.com
          Action:
          - sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              cognito-identity.amazonaws.com:aud:
                Ref: BioClockIdentityPool
            ForAnyValue:StringLike:
              cognito-identity.amazonaws.com:amr: authenticated
      Policies:
      - PolicyName: CognitoAuthorizedPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - mobileanalytics:PutEvents
            - cognito-sync:*
            - cognito-identity:*
            Resource: '*'
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            Resource:
              Fn::Sub: arn:aws:s3:::bioclock-scans-v3-${AWS::AccountId}-${AWS::Region}/public/${!cognito-identity.amazonaws.com:sub}/*
  CognitoUnauthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated: cognito-identity.amazonaws.com
          Action:
          - sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              cognito-identity.amazonaws.com:aud:
                Ref: BioClockIdentityPool
            ForAnyValue:StringLike:
              cognito-identity.amazonaws.com:amr: unauthenticated
      Policies:
      - PolicyName: CognitoUnauthorizedPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - mobileanalytics:PutEvents
            - cognito-sync:*
            Resource: '*'
  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId:
        Ref: BioClockIdentityPool
      Roles:
        authenticated:
          Fn::GetAtt:
          - CognitoAuthenticatedRole
          - Arn
        unauthenticated:
          Fn::GetAtt:
          - CognitoUnauthenticatedRole
          - Arn
  BioClockInventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bio-clock-inventory-v3
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
  ScanProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ScanProcessorFunction
      Handler: lambda_handler.lambda_handler
      Environment:
        Variables:
          TABLE_NAME:
            Ref: BioClockInventoryTable
          USER_POOL_ID:
            Ref: BioClockUserPool
          CLIENT_ID:
            Ref: BioClockUserPoolClient
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:PutItem
          - dynamodb:Query
          - dynamodb:GetItem
          Resource:
            Fn::GetAtt:
            - BioClockInventoryTable
            - Arn
      - Statement:
        - Effect: Allow
          Action:
          - rekognition:DetectLabels
          Resource: '*'
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource: '*'
      - Statement:
        - Effect: Allow
          Action:
          - s3:GetObject
          - s3:PutObject
          Resource:
            Fn::Sub: arn:aws:s3:::bioclock-scans-v3-${AWS::AccountId}-${AWS::Region}/*
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminInitiateAuth
          - cognito-idp:AdminCreateUser
          - cognito-idp:AdminSetUserPassword
          - cognito-idp:AdminGetUser
          Resource:
            Fn::GetAtt:
            - BioClockUserPool
            - Arn
      Events:
        ScanUploadEvent:
          Type: S3
          Properties:
            Bucket:
              Ref: BioClockScansBucket
            Events: s3:ObjectCreated:*
        ScanAnalyzeEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: BioClockApi
            Path: /scan/analyze
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        ScanPreserveEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: BioClockApi
            Path: /scan/preserve
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        InventoryListEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: BioClockApi
            Path: /inventory
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        ProfileStatsEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: BioClockApi
            Path: /profile/stats
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        AuthSignInEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: BioClockApi
            Path: /auth/signin
            Method: post
        AuthSignUpEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: BioClockApi
            Path: /auth/signup
            Method: post
        AuthRefreshEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: BioClockApi
            Path: /auth/refresh
            Method: post
    Metadata:
      SamResourceId: ScanProcessorFunction
  DonationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DonationFunction
      Handler: process_donation.lambda_handler
      Environment:
        Variables:
          TABLE_NAME:
            Ref: BioClockInventoryTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: BioClockInventoryTable
      Events:
        DonationApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: BioClockApi
            Path: /inventory/donate
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      SamResourceId: DonationFunction
Outputs:
  ApiGatewayUrl:
    Description: Base URL of the API Gateway
    Value:
      Fn::Sub: https://${BioClockApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  CognitoUserPoolId:
    Description: ID of the User Pool
    Value:
      Ref: BioClockUserPool
  CognitoClientId:
    Description: Client ID of the User Pool Client
    Value:
      Ref: BioClockUserPoolClient
  CognitoIdentityPoolId:
    Description: ID of the Identity Pool
    Value:
      Ref: BioClockIdentityPool
  S3BucketName:
    Description: Name of the Scans S3 Bucket
    Value:
      Ref: BioClockScansBucket
  DynamoDBTableName:
    Description: Name of the DynamoDB Table
    Value:
      Ref: BioClockInventoryTable
